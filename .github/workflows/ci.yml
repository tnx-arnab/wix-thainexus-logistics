name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Local D1 schema
        run: npm run test:schema

      - name: Worker local (D1 binding)
        run: npm run test:worker

      - name: Build
        run: npm run build

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir /tmp/tnx-wix-dry

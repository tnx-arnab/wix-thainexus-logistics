<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" href="https://media.thainexus.co.th/uploads/site/mark.png" />
        <title>404</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                color: #fff;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            }
            .wrap {
                text-align: center;
            }
            h1 {
                margin: 0;
                font-size: clamp(4.5rem, 18vw, 8rem);
                font-weight: 700;
                letter-spacing: 0.12em;
                line-height: 1;
            }
            p {
                margin: 0.85rem 0 0;
                color: #737373;
                font-size: 0.8rem;
                font-weight: 500;
                letter-spacing: 0.28em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>404</h1>
            <p>Not found</p>
        </div>
    </body>
</html>
